name: CableTester
options:
  bundleIdPrefix: com.loftspace
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  CableKit:
    path: CableKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: WV7BY8CUM8
targets:
  CableTester:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: CableKit
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cable Tester
        CFBundleName: Cable Tester
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 loftspace"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://raw.githubusercontent.com/loftspace/cable-tester-releases/main/appcast.xml
        SUPublicEDKey: UaniswKnZUBel/GQZASoYORJtyFTTNK9VWGRC2v5p/8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Cable Tester
        PRODUCT_BUNDLE_IDENTIFIER: com.loftspace.CableTester
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ""
schemes:
  CableTester:
    build:
      targets:
        CableTester: all
    test:
      targets: []
