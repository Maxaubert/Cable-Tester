            <div class="app-srow"><label>Speed</label><div class="app-field" style="width:120px">80</div><div class="app-pop">Gb/s<svg viewBox="0 0 14 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4-4 4 4M3 14l4 4 4-4"/></svg></div></div>
            <div class="app-srow" id="app-tierow"><div id="app-tieline"></div><label>Tie color</label><div class="app-sw">
              <i style="background:#ff453a"></i><i style="background:#ff9f0a"></i><i style="background:#ffd60a"></i><i style="background:#30d158"></i><i style="background:#0a84ff"><b id="app-swring"></b></i><i style="background:#bf5af2"></i><i style="background:#ff80cc"></i><i style="background:#8e8e93"></i></div></div>
            <div class="app-srow"><label>Length</label><div class="app-field" style="width:120px">1</div><span class="app-unit">m</span></div>
            <div class="app-srow" style="border-bottom:0"><label>Vendor</label><div class="app-field" style="width:260px">Apple</div></div>
            <div class="app-sbtns"><div class="app-cancel">Cancel</div><div id="app-ssave">Save</div></div>
          </div>
        </div>
      </div>
    </div>

    <svg id="app-cursor" data-layout-allow-overflow class="clip" data-start="0" data-duration="18" viewBox="0 0 20 29">
      <path d="M1.5 1.5 L1.5 22.5 L6.6 17.6 L10.2 26 L13.6 24.5 L10.1 16.4 L17 16.4 Z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>

  <script>
    // History rows: number, tie, watts, data, thunderbolt, speed, vendor, length, tested.
    const ROWS = [
      ["13", "#0a84ff", 240, "USB 4 v2", true, "80 Gb/s", "Apple", "1 m", "22 Nov at 09:14"],
      ["12", "#30d158", 240, "USB 4", true, "40 Gb/s", "Apple", "1 m", "22 Nov at 08:00"],
      ["11", "#bf5af2", 240, "USB 2", false, "480 Mb/s", "", "2 m", "22 Nov at 07:40"],
      ["10", "#ffd60a", 60, "USB 2", false, "480 Mb/s", "", "", "22 Nov at 07:10"],
      ["09", "#ff9f0a", 100, "USB 3", false, "10 Gb/s", "Belkin", "1 m", "21 Nov at 21:51"],
      ["08", "#ff453a", 100, "USB 3", false, "5 Gb/s", "Anker", "2 m", "21 Nov at 21:40"],
      ["07", "#0a84ff", 240, "USB 4 v2", true, "80 Gb/s", "Belkin", "1 m", "21 Nov at 21:32"],
      ["06", "#8e8e93", 100, "USB 4", false, "40 Gb/s", "Anker", "0.8 m", "21 Nov at 21:31"],
      ["05", "#ff80cc", 60, "USB 2", false, "480 Mb/s", "Ugreen", "0.13 m", "21 Nov at 21:21"],
      ["04", "#30d158", 100, "USB 3", false, "10 Gb/s", "", "1.5 m", "21 Nov at 20:58"],
      ["03", "#bf5af2", 240, "USB 4", true, "40 Gb/s", "CalDigit", "0.8 m", "21 Nov at 20:40"],
      ["02", "#ffd60a", 60, "USB 2", false, "480 Mb/s", "", "3 m", "21 Nov at 20:12"],
    ];
    const TB = '<svg viewBox="0 0 80 100"><polygon points="49.6,0 14.4,56 38.4,56 28.8,100 56,52 68.8,52 68.8,66 80,44 68.8,22 68.8,36 48,36" fill="#c5fa09"/></svg>';
    const ROW_H = 46, ROW_TOP = 40;
    document.querySelector("#app-stripes").innerHTML = ROWS.map((r, i) => i % 2 === 1
      ? `<div class="app-stripe" id="app-stripe-${i}" style="top:${ROW_TOP + i * ROW_H}px"></div>` : "").join("");
    document.querySelector("#app-rows").innerHTML = ROWS.map((r, i) => `<div class="app-tr" id="app-tr-${i}" style="top:${ROW_TOP + i * ROW_H}px">
      <span class="app-c c1">${r[0]}</span><span class="app-c c2"><i class="dot" style="background:${r[1]}"></i></span>
      <span class="app-c c3">${r[2]} W</span><span class="app-c c4">${r[4] ? `<span class="tb">${TB}${r[3]}</span>` : r[3]}</span>
      <span class="app-c c5">${r[5]}</span><span class="app-c c6">${r[6] || '<span class="add">Add</span>'}</span>
      <span class="app-c c7">${r[7] || '<span class="add">Add</span>'}</span><span class="app-c c8 when">${r[8]}</span></div>`).join("");

    const tl = gsap.timeline({ paused: true });
    // Every tween keeps its start state in CSS, so nothing is written at build time.
    const F = (t, from, to, at) => tl.fromTo(t, from, Object.assign({ immediateRender: false }, to), at);
    const click = (at) => { F("#app-cursor", { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power2.out" }, at);
                            F("#app-cursor", { scale: 0.86 }, { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.07); };
    const move = (x0, y0, x, y, at, d = 0.65) => F("#app-cursor", { x: x0, y: y0 }, { x, y, duration: d, ease: "power2.inOut" }, at);

    // 0. The app arrives slightly large out of the icon and settles.
    F([".app-tb", ".app-body"], { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.08 }, 0.02);
    F("#app-cursor", { x: 2000, y: 1200 }, { x: 2000, y: 1200, duration: 0.01 }, 0);
    // The first ring pulses, as in the app.
    F("#app-ring1", { opacity: 1 }, { opacity: 0.4, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.2);

    // 1. Mac end in: the collar lights up, the bolt outline draws, check 1. The plug itself stays still.
    const s1 = 2.3;
    F("#app-ledge", { backgroundColor: "#343434" }, { backgroundColor: "#c5fa09", duration: 0.3, ease: "power2.out" }, s1);
    F("#app-boltline", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, s1 + 0.4);
    F("#app-ring1", { opacity: 1 }, { opacity: 0, duration: 0.1 }, s1);
    F("#app-disc1", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.2)" }, s1);
    F("#app-tick1", { strokeDashoffset: 20 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, s1 + 0.14);
    F("#app-t0", { opacity: 1 }, { opacity: 0, duration: 0.25 }, s1);
    F("#app-t1", { opacity: 0 }, { opacity: 1, duration: 0.25 }, s1);
    F("#app-d1a", { opacity: 1 }, { opacity: 0, duration: 0.14 }, s1);
    F("#app-d1b", { opacity: 0 }, { opacity: 1, duration: 0.22 }, s1 + 0.14);
    F("#app-ring2", { borderColor: "rgba(255,255,255,0.25)" }, { borderColor: "#c5fa09", duration: 0.2 }, s1);
    F("#app-lb2", { color: "rgba(255,255,255,0.55)" }, { color: "#ffffff", duration: 0.2 }, s1);
    F("#app-ring2", { opacity: 1 }, { opacity: 0.4, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, s1 + 0.4);

    // 2. Other end in (4.0): the bolt fills, glows and pops, check 2.
    const s2 = 4.5;
    F("#app-boltfill", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, s2);
    F("#app-bolt", { scale: 1, filter: "drop-shadow(0 0 0px rgba(197,250,9,0))" },
      { scale: 1.14, filter: "drop-shadow(0 0 16px rgba(197,250,9,0.7))", duration: 0.18, ease: "power2.out" }, s2);
    F("#app-bolt", { scale: 1.14 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, s2 + 0.18);
    F("#app-ring2", { opacity: 1 }, { opacity: 0, duration: 0.1 }, s2);
    F("#app-disc2", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.2)" }, s2);
    F("#app-tick2", { strokeDashoffset: 20 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, s2 + 0.14);
    F("#app-t1", { opacity: 1 }, { opacity: 0, duration: 0.25 }, s2);
    F("#app-t2", { opacity: 0 }, { opacity: 1, duration: 0.25 }, s2);
    F("#app-d2a", { opacity: 1 }, { opacity: 0, duration: 0.14 }, s2);
    F("#app-d2b", { opacity: 0 }, { opacity: 1, duration: 0.22 }, s2 + 0.14);

    // 3. Hold 0.9 s, then the checklist cascades out top to bottom and the camera pulls back.
    const out = s2 + 0.9;
    F(["#app-illus", ".app-ctitle", "#app-list"], { opacity: 1, y: 0 },
      { opacity: 0, y: -22, duration: 0.26, ease: "power3.in", stagger: 0.06 }, out);
    F("#app-recent", { opacity: 1, y: 0 }, { opacity: 0, y: -22, duration: 0.26, ease: "power3.in" }, out);

    // 4. The result builds line by line; the watts count up. (5.3)
    const res = out + 0.4;
    F("#app-result > *", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.07 }, res);
    F("#app-insp > *", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.07 }, res + 0.18);
    const counter = { v: 0 };
    F(counter, { v: 0 }, { v: 240, duration: 1.1, ease: "power3.out",
      onUpdate: () => { document.querySelector("#app-num").textContent = Math.round(counter.v); } }, res + 0.3);

    // 5. Save (8.0): cursor to Save, the sheet drops, blue tie, Save, the button morphs.
    const sv = res + 2.75;
    move(2000, 1200, 240, 808, sv, 0.7);
    click(sv + 0.75);
    F("#app-save", { scale: 1 }, { scale: 0.96, duration: 0.07, yoyo: true, repeat: 1 }, sv + 0.75);
    F("#app-sheet", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, sv + 0.8);
    move(240, 808, 974, 578, sv + 1.25, 0.6);
    click(sv + 1.9);
    F("#app-swring", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, sv + 1.9);
    F("#app-tieline", { opacity: 1 }, { opacity: 0, duration: 0.2 }, sv + 1.9);
    move(974, 578, 1302, 796, sv + 2.1, 0.55);
    click(sv + 2.7);
    F("#app-ssave", { scale: 1 }, { scale: 0.95, duration: 0.07, yoyo: true, repeat: 1 }, sv + 2.7);
    F("#app-sheet", { opacity: 1, y: 0 }, { opacity: 0, y: -60, duration: 0.28, ease: "power3.in" }, sv + 2.78);
    F("#app-save-a", { opacity: 1 }, { opacity: 0, duration: 0.18 }, sv + 3.1);
    F("#app-save-b", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, sv + 3.1);
    F("#app-save", { backgroundColor: "#c5fa09" }, { backgroundColor: "#e9ffb0", duration: 0.3 }, sv + 3.1);

    // 6. History (12.6): cursor to the clock, the Now screen lifts away, History cascades in.
    const hi = sv + 3.85;
    move(1302, 796, 1790, 92, hi, 0.65);
    click(hi + 0.7);
    F("#app-clock", { scale: 1 }, { scale: 0.92, duration: 0.07, yoyo: true, repeat: 1 }, hi + 0.7);
    const sw = hi + 0.72;
    F("#app-now", { opacity: 1, y: 0 }, { opacity: 0, y: -22, duration: 0.22, ease: "power3.in" }, sw);
    F(["#app-side", "#app-clock"], { opacity: 1 }, { opacity: 0, duration: 0.15 }, sw);
    F(["#app-back", "#app-hacts"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, sw + 0.1);
    F("#app-title", { x: 0 }, { x: 108, duration: 0.25, ease: "power2.out" }, sw + 0.05);
    F("#app-cursor", { opacity: 1 }, { opacity: 0, duration: 0.2 }, sw + 0.3);
    const hin = sw + 0.3;
    F(["#app-hist .app-htitle", "#app-hist .app-hbar", "#app-hist .app-table", "#app-hist .app-foot"], { opacity: 0, y: 22 },
      { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.045 }, hin);
    F(".app-th", { opacity: 0 }, { opacity: 1, duration: 0.3 }, hin + 0.09);
    F("#app-rows .app-tr", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.045 }, hin + 0.14);
    F("#app-stripes .app-stripe", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.09 }, hin + 0.18);
    F("#app-newmark", { opacity: 0 }, { opacity: 1, duration: 0.4 }, hin + 0.6);
    F("#app-newmark", { opacity: 1 }, { opacity: 0, duration: 0.6 }, hin + 1.8);

    // 7. Thunderbolt filter (15.2): the other rows fade, the four Thunderbolt rows slide up.
    const fl = hin + 1.9;
    move(1790, 92, 1730, 262, fl - 0.05, 0.01);
    F("#app-cursor", { opacity: 0 }, { opacity: 1, duration: 0.2 }, fl);
    move(1730, 262, 1730, 262, fl, 0.01);
    move(1500, 560, 1735, 252, fl, 0.6);
    click(fl + 0.65);
    F("#app-segpill", { x: 0 }, { x: 560, duration: 0.35, ease: "power3.out" }, fl + 0.68);
    const tbRows = ROWS.map((r, i) => r[4] ? i : -1).filter(i => i >= 0);
    const others = ROWS.map((r, i) => r[4] ? -1 : i).filter(i => i >= 0);
    F(others.map(i => `#app-tr-${i}`), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, fl + 0.7);
    tbRows.forEach((i, k) => F(`#app-tr-${i}`, { y: 0 }, { y: (k - i) * ROW_H, duration: 0.5, ease: "expo.out" }, fl + 0.82));
    F(ROWS.map((r, i) => i).filter(i => i % 2 === 1 && i > 3).map(i => `#app-stripe-${i}`), { opacity: 1 }, { opacity: 0, duration: 0.2 }, fl + 0.7);
    F("#app-foot1", { opacity: 1 }, { opacity: 0, duration: 0.15 }, fl + 0.8);
    F("#app-foot2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, fl + 0.85);
    F("#app-cursor", { opacity: 1 }, { opacity: 0, duration: 0.3 }, fl + 1.5);

    // 8. Carry across (17.4): the window shrinks into the end card's icon position.
    tl.set("#app-cam", { transformOrigin: "542px 500px" }, 17.3);
    F("#app-cam", { scale: 1, x: 0, y: 0, opacity: 1, filter: "blur(0px)" },
      { scale: 0.19, x: 0, y: 0, opacity: 0, filter: "blur(8px)", duration: 0.6, ease: "power3.in" }, 17.38);

    window.__timelines["app"] = tl;
  </script>
</template>
